schema_version: 1

context:
  version: "4.26.275"

package:
  name: inotify-tools
  version: ${{ version }}

source:
  url: https://github.com/rvoicilas/inotify-tools/archive/${{ version }}.tar.gz
  sha256: 11bba75bafb28d872ee91d0c36b0f8a015fcbc3ce0f8d3275445c95d26e04b81

build:
  number: 0
  skip:
    - not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - automake
    - autoconf
    - libtool
    - make

tests:
  - script:
      # --help returns 1
      - inotifywatch --help || [[ $? == 1 ]]
      - inotifywait --help || [[ $? == 1 ]]

about:
  homepage: https://github.com/inotify-tools/inotify-tools
  license: GPL-2.0-only
  license_file: COPYING
  summary: This is a package of some commandline utilities relating to inotify.
  description: |
    The general purpose of this package is to allow inotify's features to be
    used from within shell scripts.
  documentation: https://github.com/inotify-tools/inotify-tools/wiki

extra:
  recipe-maintainers:
    - keuv-grvl
