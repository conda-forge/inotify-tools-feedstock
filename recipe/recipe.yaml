schema_version: 1

context:
  version: "4.26.272"

package:
  name: inotify-tools
  version: ${{ version }}

source:
  url: https://github.com/rvoicilas/inotify-tools/archive/${{ version }}.tar.gz
  sha256: 1572c72bf4113261aa0b148bddf5323e5d12b6f5a4b5ab4e1478a5d108f9e464

build:
  number: 0
  skip:
    - not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - automake
    - autoconf
    - libtool
    - make

tests:
  - script:
      # --help returns 1
      - inotifywatch --help || [[ $? == 1 ]]
      - inotifywait --help || [[ $? == 1 ]]

about:
  homepage: https://github.com/inotify-tools/inotify-tools
  license: GPL-2.0-only
  license_file: COPYING
  summary: This is a package of some commandline utilities relating to inotify.
  description: |
    The general purpose of this package is to allow inotify's features to be
    used from within shell scripts.
  documentation: https://github.com/inotify-tools/inotify-tools/wiki

extra:
  recipe-maintainers:
    - keuv-grvl
